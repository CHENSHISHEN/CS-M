name: build-macos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install app runtime dependencies
        run: npm ci --prefix app

      - name: Preflight
        run: npm run preflight -- mac-${{ matrix.arch }}

      - name: Build & package (DMG ${{ matrix.arch }}, unsigned)
        run: npm run package-mac-${{ matrix.arch }}
        env:
          ELECTRON_MIRROR: ""
          ELECTRON_BUILDER_BINARIES_MIRROR: ""

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS-M-darwin_${{ matrix.arch }}-installer
          path: dist/*_v*.dmg
          if-no-files-found: error
